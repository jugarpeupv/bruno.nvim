info:
  name: OAuth Folder
  type: folder
request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: https://example.com/token
    credentials:
      clientId: folder-client
      clientSecret: folder-secret
      placement: body
    scope: read
    tokenConfig:
      id: folder-credentials
    settings:
      autoFetchToken: true
      autoRefreshToken: false
